<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>M20T WiFi 配置</title></head>
<body style="font-family:sans-serif;max-width:420px;margin:30px auto">
<h2>M20T WiFi 配网</h2>
<p>输入要让设备连接的 WiFi：</p>
<form method="POST" action="/cgi-bin/save">
<p>SSID（名称）：<br><input name="ssid" style="width:100%;font-size:16px"></p>
<p>密码：<br><input name="pass" type="password" style="width:100%;font-size:16px"></p>
<p><input type="submit" value="保存并连接" style="width:100%;padding:12px;font-size:16px"></p>
</form>
<p><a href="/cgi-bin/scan.sh">扫描周围网络</a></p>
</body></html>
